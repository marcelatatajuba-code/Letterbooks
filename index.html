<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letterbooks — seu diário de leitura</title>
<meta name="description" content="Registre o que você lê, dê estrelas, escreva resenhas e monte listas. Um diário de leitura com o acervo aberto da Open Library.">
<meta name="theme-color" content="#14181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Letterbooks">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/icone-180.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- ------------------------------------------------------------------ topo -->
<header class="topo">
  <a class="marca" href="#/inicio" aria-label="Letterbooks, ir para o início">
    <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path class="l1" d="M9.5 12.8 L17.4 11 L20.6 38.5 L12.6 38.5 Z"/>
      <path class="lp" d="M17.4 11 L19.6 10.5 L22.9 38.5 L20.6 38.5 Z"/>
      <path class="l2" d="M22.6 9 L30.2 9 L30.2 38.5 L22.6 38.5 Z"/>
      <path class="lp" d="M30.2 9 L32.4 9 L32.4 38.5 L30.2 38.5 Z"/>
      <path class="l3" d="M36.6 10.4 L43.4 11.9 L40.3 38.5 L33.5 38.5 Z"/>
      <path class="lp" d="M43.4 11.9 L45.4 12.3 L42.3 38.5 L40.3 38.5 Z"/>
      <rect class="lp" x="6" y="39.8" width="38" height="3.4" rx="1.7"/>
    </svg>
    <b>Letter<i>books</i></b>
  </a>

  <nav class="topo-nav" id="topo-nav" aria-label="Seções">
    <a href="#/inicio">Livros</a>
    <a href="#/diario">Diário</a>
    <a href="#/estante">Estante</a>
    <a href="#/listas">Listas</a>
    <a href="#/perfil">Perfil</a>
  </nav>

  <div class="topo-fim">
    <form class="topo-busca" id="forma-busca" role="search">
      <input id="campo-busca" type="search" placeholder="Buscar livro, autor ou ISBN"
             autocomplete="off" aria-label="Buscar livros">
      <button type="submit" aria-label="Buscar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path>
        </svg>
      </button>
    </form>
    <button class="botao-registrar" id="botao-registrar" aria-label="Registrar uma leitura">+<span> Registrar</span></button>
  </div>
</header>

<!-- ------------------------------------------------------------- conteúdo -->
<main class="pagina" id="tela" tabindex="-1"></main>

<!-- Navegação de rodapé, para quando a do topo se recolhe no celular. -->
<nav class="abas-pe" id="abas-pe" aria-label="Seções">
  <a href="#/inicio">Livros</a>
  <a href="#/diario">Diário</a>
  <a href="#/estante">Estante</a>
  <a href="#/listas">Listas</a>
  <a href="#/perfil">Perfil</a>
</nav>

<div id="camada"></div>

<script src="./js/api.js"></script>
<script src="./js/dados.js"></script>
<script src="./js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* sem offline, tudo bem */ });
    });
  }
</script>
</body>
</html>
