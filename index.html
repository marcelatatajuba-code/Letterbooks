<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letterbooks — seu diário de leitura</title>
<meta name="description" content="Registre o que você lê, dê estrelas, escreva resenhas e monte listas. Um diário de leitura com o acervo aberto da Open Library.">
<meta name="theme-color" content="#16110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Letterbooks">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/icone-180.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- ------------------------------------------------------------------ topo -->
<header class="topo">
  <a class="marca" href="#/inicio" aria-label="Letterbooks, ir para o início">
    <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path class="l1" d="M9.5 12.8 L17.4 11 L20.6 38.5 L12.6 38.5 Z"/>
      <path class="lp" d="M17.4 11 L19.6 10.5 L22.9 38.5 L20.6 38.5 Z"/>
      <path class="l2" d="M22.6 9 L30.2 9 L30.2 38.5 L22.6 38.5 Z"/>
      <path class="lp" d="M30.2 9 L32.4 9 L32.4 38.5 L30.2 38.5 Z"/>
      <path class="l3" d="M36.6 10.4 L43.4 11.9 L40.3 38.5 L33.5 38.5 Z"/>
      <path class="lp" d="M43.4 11.9 L45.4 12.3 L42.3 38.5 L40.3 38.5 Z"/>
      <rect class="lp" x="6" y="39.8" width="38" height="3.4" rx="1.7"/>
    </svg>
    <b>Letter<i>books</i></b>
  </a>

  <nav class="topo-nav" id="topo-nav" aria-label="Seções">
    <a href="#/inicio">Livros</a>
    <a href="#/diario">Diário</a>
    <a href="#/estante">Estante</a>
    <a href="#/listas">Listas</a>
    <a href="#/perfil">Perfil</a>
  </nav>

  <div class="topo-fim">
    <form class="topo-busca" id="forma-busca" role="search">
      <input id="campo-busca" type="search" placeholder="Buscar livro, autor ou ISBN"
             autocomplete="off" aria-label="Buscar livros">
      <button type="submit" aria-label="Buscar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path>
        </svg>
      </button>
    </form>
    <button class="botao-registrar" id="botao-registrar" aria-label="Registrar uma leitura">+<span> Registrar</span></button>
  </div>
</header>

<!-- ------------------------------------------------------------- conteúdo -->
<main class="pagina" id="tela" tabindex="-1"></main>

<!-- Barra de navegação do celular, no desenho do original: quatro ícones e o
     botão de registrar em destaque no meio. Estante e listas não ficam aqui —
     elas vivem dentro do perfil, como no Letterboxd. -->
<nav class="abas-pe" id="abas-pe" aria-label="Seções">
  <a href="#/inicio" aria-label="Livros">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3"  y="5"  width="4.4" height="14" rx="1"/>
      <rect x="9.8" y="5" width="4.4" height="14" rx="1"/>
      <rect x="16.6" y="5" width="4.4" height="14" rx="1"/>
    </svg>
    <span>Livros</span>
  </a>
  <a href="#/buscar" aria-label="Buscar">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.8-3.8"></path>
    </svg>
    <span>Buscar</span>
  </a>
  <button class="aba-mais" id="aba-mais" aria-label="Registrar uma leitura">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2.6" stroke-linecap="round">
      <path d="M12 6v12M6 12h12"></path>
    </svg>
  </button>
  <a href="#/diario" aria-label="Diário">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4"  width="18" height="2.6" rx="1.3"/>
      <rect x="3" y="10.7" width="18" height="2.6" rx="1.3"/>
      <rect x="3" y="17.4" width="18" height="2.6" rx="1.3"/>
    </svg>
    <span>Diário</span>
  </a>
  <a href="#/perfil" aria-label="Perfil">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>
    </svg>
    <span>Perfil</span>
  </a>
</nav>

<div id="camada"></div>

<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/dados.js"></script>
<script src="./js/nuvem.js"></script>
<script src="./js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* sem offline, tudo bem */ });
    });
  }
</script>
</body>
</html>
