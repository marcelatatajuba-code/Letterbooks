# Publica o Letterbooks no GitHub Pages a cada push na main.
#
# O app e estatico e nao tem etapa de build: o que esta no repositorio e
# exatamente o que vai para o ar. Por isso o job so empacota a raiz e publica.
name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, sem cancelar o que ja esta rodando.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Buscar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Pages
        uses: actions/configure-pages@v5
        with:
          # Liga o Pages sozinho na primeira vez, em vez de exigir que
          # alguem va ligar na mao nas configuracoes do repositorio.
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
